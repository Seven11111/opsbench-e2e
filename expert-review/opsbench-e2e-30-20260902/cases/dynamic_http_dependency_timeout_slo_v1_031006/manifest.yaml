      target: http_service
      params: {}
    public_task:
      symptom: Clients experience slow response times and intermittent timeouts when
        requesting large payloads through the proxy. The proxy logs show read timeouts.
      impact: Business operations that depend on large response payloads (e.g., file
        downloads, API responses with large bodies) fail intermittently.
      objective: Restore normal response handling so that all responses complete within
        the configured timeout, while preserving the existing timeout policy and without
        degrading cache performance.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
    allowed_tools:
    - shell
    - business_check
    - diagnose
    - health_check
    - metrics_query
    - service_repair
    expected_actions:
    - primitive_id: http_dependency_timeout_slo_v1
      action: repair
    success_checks:
    - check_id: business_operation
      weight: 0.25
    - check_id: request_latency_slo
      weight: 0.25
    - check_id: timeout_policy
      weight: 0.25
    - check_id: persistence
      weight: 0.25
    negative_controls:
    - scenario: no_op
      expected: fail
      reason: Without any change, the timeout symptom persists.
    - scenario: restart_only
      expected: fail
      reason: Restarting the proxy does not change the buffering configuration; the
        root cause remains.
    - scenario: wrong_layer_fix
      expected: fail
      reason: Changing only the upstream server's response size or timeout does not
        address the proxy's buffering behavior.
    - scenario: symptom_bypass
      expected: fail
      reason: Increasing the client-side timeout masks the symptom but does not restore
        the proxy's ability to read large responses efficiently.
    - scenario: partial_fix
      expected: fail
      reason: Enabling buffering without adjusting buffer sizes may still cause timeouts
        for very large responses.
