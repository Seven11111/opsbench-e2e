      target: tls_service
      params: {}
    public_task:
      symptom: TLS connections to the service are failing with certificate validation
        errors. Clients attempting to establish secure connections receive errors
        indicating that the server certificate validation has failed.
      impact: The service is unable to complete TLS handshakes with proper hostname
        verification. Secure communication with clients is disrupted.
      objective: Restore the ability to establish secure TLS connections while maintaining
        certificate validation and hostname checking.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
    allowed_tools:
    - shell
    - business_check
    - diagnose
    - health_check
    - service_repair
