    - primitive_id: tls_hostname_mismatch_v1
      action: repair
    success_checks:
    - check_id: business_operation
      weight: 0.25
    - check_id: tls_hostname
      weight: 0.25
    - check_id: certificate_chain
      weight: 0.25
    - check_id: persistence
      weight: 0.25
    negative_controls:
    - scenario: no_op
      expected: fail
      reason: No action taken; the fault remains and TLS connections still fail.
    - scenario: oracle
      expected: pass
      reason: 'Correct repair applied: the TLS context is configured with proper hostname
        matching and certificate validation.'
    - scenario: restart_only
      expected: fail
      reason: Restarting the service does not correct the underlying hostname mismatch
        configuration; the fault persists after restart.
    - scenario: wrong_layer_fix
      expected: fail
      reason: Modifying a non-TLS configuration layer (e.g., network settings) does
        not address the certificate hostname mismatch.
    - scenario: symptom_bypass
      expected: fail
      reason: Disabling certificate validation or hostname checking suppresses the
        symptom but violates security constraints and does not fix the root cause.
    - scenario: insecure_fix
      expected: fail
      reason: Using an insecure protocol or disabling verification undermines security
        and does not achieve proper hostname validation.
    - scenario: partial_fix
      expected: fail
      reason: Only partially addressing the configuration (e.g., loading certificates
        but not enabling hostname check) leaves the TLS handshake broken.
