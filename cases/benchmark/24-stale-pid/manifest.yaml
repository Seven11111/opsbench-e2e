  semantic_state:
  - live application PID identity
  - business operation
  public_oracle: app_stale_pid_v1
  public_success_signals: &id001
  - Restore the documented business operation using live state.
  - Confirm that the underlying fault signal is gone, not merely hidden.
  - Verify that the repair survives the applicable restart or reconciler boundary.
  - Confirm the service has a live process identity that belongs to the intended application,
    not only a file with a numeric value.
  - Confirm the service remains healthy after a lifecycle restart.
  public_contract:
    public_task_goal: Restore the declared business operation and preserve its service
      contract.
    observable_signals: *id001
    available_tools:
    - service_list
    - service_status
    - signal_view
    - business_probe
    - service_manage
    public_invariants:
    - Use only the declared bounded tools.
    - Preserve unrelated workload and service contract.
    - Verify recovery after the declared lifecycle boundary.
  control_expectations:
    no_op:
      expected: fail
      reason: The injected fault remains active.
    oracle:
      expected: pass
      reason: The registered safe repair restores the public contract.
    wrong_fix:
      expected: fail
      reason: The symptom is not repaired while preserving the contract.
    partial_fix:
      expected: fail
      reason: A critical recovery or persistence condition remains unsatisfied.
    restart_only:
      expected: fail
      reason: Restart alone is not a durable repair unless the case explicitly declares
        otherwise.
  internal_contract:
    allowed_repair_classes:
    - service_manage:restart
    - service_manage:stop_start
    verifier_checks:
    - business_operation
    - pid_identity
    - persistence
    task_verifier_mapping:
    - check_id: business_operation
      public_signal: Restore the documented business operation using live state.
    - check_id: pid_identity
      public_signal: Confirm that the underlying fault signal is gone, not merely
        hidden.
    - check_id: persistence
      public_signal: Verify that the repair survives the applicable restart or reconciler
        boundary.
    known_valid_solutions: []
    known_invalid_solutions: []
difficulty_contract: {}
