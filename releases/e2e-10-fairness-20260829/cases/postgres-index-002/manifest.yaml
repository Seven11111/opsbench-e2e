      symptom: A database query that should return a moderate number of rows is running
        slowly; the query plan shows a sequential scan instead of an index scan, and
        the query takes several seconds to complete.
      impact: Application response times are degraded, and the database server CPU
        usage is higher than expected for this workload.
      objective: Restore query performance so that the query uses an index scan and
        completes within normal latency (e.g., under 100 ms).
