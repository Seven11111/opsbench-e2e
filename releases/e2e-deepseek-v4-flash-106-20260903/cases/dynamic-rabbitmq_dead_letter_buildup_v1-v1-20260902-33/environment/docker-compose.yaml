services:
  target:
    build:
      context: .
      dockerfile: Dockerfile
    image: opsbench-e2e-rabbitmq_dead_letter_buildup_v1
    working_dir: /runtime
    command: ["python", "/opt/opsbench/service.py"]
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
      - /data
    volumes:
      - ./runtime/profile.json:/etc/opsbench/profile.json:ro
      - ./runtime/fault.json:/runtime/fault.json
      - ./runtime/status.json:/runtime/status.json
      - ./runtime/appctl.sh:/opt/opsbench/runtime/appctl.sh:ro
      - ${OPSBENCH_PUBLIC_DIR:-../public}:/opsbench/public:ro
      - ${OPSBENCH_TRACE_DIR:-../trace}:/opsbench/trace
    environment:
      OPSBENCH_BASE_URL: ${OPSBENCH_BASE_URL:-https://api.deepseek.com}
      OPSBENCH_AGENT_MODEL: ${OPSBENCH_AGENT_MODEL:-deepseek-v4-flash}
      OPSBENCH_REQUEST_TIMEOUT: ${OPSBENCH_REQUEST_TIMEOUT:-300}
      OPSBENCH_MAX_RETRIES: ${OPSBENCH_MAX_RETRIES:-2}
      OPSBENCH_TEMPLATE_ID: rabbitmq_dead_letter_buildup_v1
      OPSBENCH_HEALTH_MODE: status
      OPSBENCH_BUSINESS_CHECK_URL: http://127.0.0.1:8080/business
      OPSBENCH_METRICS_URL: http://127.0.0.1:8080/metrics
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  control:
    image: opsbench-e2e-rabbitmq_dead_letter_buildup_v1
    working_dir: /runtime
    command: ["sleep", "infinity"]
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../:/opsbench/case:ro
      - ./runtime/profile.json:/etc/opsbench/profile.json:ro
      - ./runtime/fault.json:/runtime/fault.json
      - ./runtime/status.json:/runtime/status.json

  verifier:
    image: opsbench-e2e-rabbitmq_dead_letter_buildup_v1
    working_dir: /runtime
    command: ["sleep", "infinity"]
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ../:/opsbench/case:ro
      - ./runtime/profile.json:/etc/opsbench/profile.json:ro
      - ./runtime/fault.json:/runtime/fault.json
      - ./runtime/status.json:/runtime/status.json
    environment:
      OPSBENCH_TARGET_URL: http://target:8080
