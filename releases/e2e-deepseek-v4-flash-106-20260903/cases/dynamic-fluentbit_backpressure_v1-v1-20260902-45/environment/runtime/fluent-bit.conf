[SERVICE]
    Flush        1
    Daemon       Off
    HTTP_Server  On
    HTTP_Listen  0.0.0.0
    HTTP_Port    2020
    storage.path /tmp/flb-storage
    storage.metrics on
    hot_reload   on
[INPUT]
    Name         http
    Listen       0.0.0.0
    Port         9880
    Tag          opsbench.http
[OUTPUT]
    Name         forward
    Match        *
    Host         sink
    Port         24224
    Retry_Limit  False
