    public_task:
      symptom: An HTTP reverse proxy is experiencing timeouts when proxying responses.
        Clients report that requests with large response bodies fail intermittently
        with 504 Gateway Timeout errors. The proxy logs show that connections are
        closed after the read timeout, even though the total response time from the
        upstream server is within acceptable limits. The timeout value is set to 60
        seconds.
      impact: Users are unable to complete operations that involve large response
        payloads, leading to degraded service availability.
      objective: Restore the proxy's ability to successfully complete all requests
        without timeout errors, ensuring that the service contract for response latency
        is met.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
    allowed_tools:
    - shell
    - business_check
