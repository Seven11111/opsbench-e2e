      weight: 0.25
    - check_id: persistence
      weight: 0.25
    negative_controls:
    - scenario: no_op
      expected: fail
      reason: No action is taken; the timeout behavior remains unchanged.
    - scenario: restart_only
      expected: fail
      reason: Restarting the proxy without changing the buffer configuration does
        not fix the underlying timeout issue.
    - scenario: wrong_layer_fix
      expected: fail
      reason: Editing a different configuration layer (e.g., upstream server timeout)
        does not address the proxy buffering behavior.
    - scenario: partial_fix
      expected: fail
      reason: Increasing the buffer size without enabling buffering does not prevent
        the inter-read timeout.
