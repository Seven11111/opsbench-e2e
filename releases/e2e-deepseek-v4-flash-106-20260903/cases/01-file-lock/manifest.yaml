    public_task:
      symptom: The file-processing worker is repeatedly failing when it tries to obtain
        the report lock. The health endpoint and the file-processing operation are
        affected, and the problem may return after a short observation period even if
        the worker appears to recover briefly.
      impact: New reports remain unprocessed and the backlog grows. Preserve the existing
        file-processing and locking contract while restoring the operation.
      objective: Diagnose the live lock condition, restore reliable report processing,
        and verify that the repair remains effective after the declared observation
        boundary.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
      - Do not treat killing one process or deleting one lock file as sufficient unless
        the live lock condition remains absent.
    allowed_tools:
    - shell
    - health_check
    - metrics_query
