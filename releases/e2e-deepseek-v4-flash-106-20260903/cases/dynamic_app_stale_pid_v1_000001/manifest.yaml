      weight: 0.3333333333333333
    - check_id: persistence
      weight: 0.3333333333333333
    negative_controls:
    - scenario: no_op
      expected: fail
      reason: Doing nothing leaves the stale PID state and the service manager cannot
        detect failures.
    - scenario: restart_only
      expected: fail
      reason: A simple restart may temporarily restore the process but does not fix
        the PID tracking issue; after a subsequent crash, automatic restart still
        fails.
    - scenario: wrong_fix
      expected: fail
      reason: Editing an unrelated configuration (e.g., log level) does not correct
        the main PID determination.
    - scenario: partial_fix
      expected: fail
      reason: Fixing the service binary path but not the PID tracking mechanism leaves
        the root cause unresolved.
