    public_task:
      symptom: The service manager reports the service as active, but the application
        does not respond to HTTP requests. If the service process is terminated, it
        is not automatically restarted, and manual intervention is required to restore
        service.
      impact: Service unavailability and lack of automatic recovery increase operational
        burden and downtime.
      objective: Restore the service's automatic restart capability so that the service
        manager correctly detects failures and restarts the service after a crash.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
    allowed_tools:
    - shell
    - health_check
