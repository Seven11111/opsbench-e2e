public_actionability:
  version: e2e-task-tools-verifier-alignment-v1
  required: true
  verifier_policy: semantic_state_not_representation_artifact
  required_tools: &id002
  - command_run
  - service_status
  - metrics_read
  repair_operations:
  - bounded_state_change
  verifier_checks: &id003
  - business_operation
  - root_signal_absent
  - repair_invariant
  - persistence
  public_success_signals: &id001
  - The live health endpoint returns HTTP 200.
  - The business operation remains usable after the repair.
  - The repair preserves the service contract and remains valid after observation.
  semantic_state:
  - observable business operation
  - observable root signal absent
  - observable repair invariant
  - observable persistence
  public_oracle: null
  public_contract:
    public_task_goal: Restore the declared business operation and preserve its service
      contract.
    observable_signals: *id001
    available_tools: *id002
    public_invariants:
    - Use only the declared bounded tools.
    - Preserve unrelated workload and service contract.
    - Verify recovery after the declared lifecycle boundary.
  control_expectations:
    no_op:
      expected: fail
      reason: The injected fault remains active.
    oracle:
      expected: pass
      reason: The registered safe repair restores the public contract.
    wrong_fix:
      expected: fail
      reason: The symptom is not repaired while preserving the contract.
    partial_fix:
      expected: fail
      reason: A critical recovery or persistence condition remains unsatisfied.
    restart_only:
      expected: fail
      reason: Restart alone is not a durable repair unless the case explicitly declares
        otherwise.
  internal_contract:
    allowed_repair_classes:
    - bounded_state_change
    verifier_checks: *id003
    task_verifier_mapping:
    - check_id: business_operation
      public_signal: The live health endpoint returns HTTP 200.
    - check_id: root_signal_absent
      public_signal: The business operation remains usable after the repair.
    - check_id: repair_invariant
      public_signal: The repair preserves the service contract and remains valid after
        observation.
    known_valid_solutions: []
    known_invalid_solutions: []
