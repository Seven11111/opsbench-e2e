    public_task:
      symptom: The HTTP service is reported as active by the system service manager,
        but health checks against the service fail. The service does not respond to
        requests, and the service manager indicates the service started successfully
        even though the service binary is not functioning.
      impact: Users cannot access the HTTP service, causing downtime.
      objective: Restore the service to a state where it passes health checks and
        responds to requests correctly. The service manager should accurately reflect
        the service's operational status.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
    allowed_tools:
    - shell
    - health_check
    expected_actions:
    - primitive_id: app_stale_pid_v1
      action: repair
    success_checks:
    - check_id: pid_state
      weight: 0.3
    - check_id: business_operation
      weight: 0.4
    - check_id: persistence
      weight: 0.3
    negative_controls:
    - scenario: no_op
      expected: fail
      reason: Doing nothing does not fix the stale PID; service remains unhealthy.
    - scenario: restart_only
      expected: fail
      reason: Restarting the service without fixing the stale PID file may temporarily
        work but the underlying issue persists; the service manager may still have
        incorrect PID tracking.
    - scenario: wrong_fix
      expected: fail
      reason: Modifying an unrelated configuration file does not address the stale
        PID file or incorrect PID determination.
    - scenario: partial_fix
      expected: fail
      reason: Only updating the PID file without ensuring the service manager re-reads
        it or restarting the service leaves the service in an inconsistent state.
