services:
  rabbitmq:
    image: rabbitmq:3.13-management
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: opsbench
      RABBITMQ_DEFAULT_PASS: opsbench-local-only
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  target:
    build: {context: ., dockerfile: Dockerfile}
    command: ["python", "/opt/opsbench/service.py"]
    working_dir: /runtime
    volumes:
      - ./runtime:/runtime
      - ${OPSBENCH_PUBLIC_DIR:-../public}:/opsbench/public:ro
      - ${OPSBENCH_TRACE_DIR:-../trace}:/opsbench/trace
    environment:
      OPSBENCH_TEMPLATE_ID: fidelity_rabbitmq_prefetch_starvation_v1
      OPSBENCH_FIDELITY_TEMPLATE: fidelity_rabbitmq_prefetch_starvation_v1
      PGHOST: db
      PGUSER: opsbench
      PGPASSWORD: opsbench-local-only
      PGDATABASE: app
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
  control:
    build: {context: ., dockerfile: Dockerfile}
    command: ["sleep", "infinity"]
    volumes:
      - ../:/opsbench/case:ro
      - ./runtime:/runtime
  verifier:
    build: {context: ., dockerfile: Dockerfile}
    command: ["sleep", "infinity"]
    volumes:
      - ../:/opsbench/case:ro
      - ./runtime:/runtime
