services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  target:
    build: {context: ., dockerfile: Dockerfile}
    command: ["python", "/opt/opsbench/service.py"]
    volumes:
      - ./runtime/state.json:/runtime/state.json
      - ${OPSBENCH_PUBLIC_DIR:-../public}:/opsbench/public:ro
      - ${OPSBENCH_TRACE_DIR:-../trace}:/opsbench/trace
    environment:
      OPSBENCH_HEALTH_MODE: service
      OPSBENCH_HEALTH_URL: http://127.0.0.1:18088/health
    depends_on:
      kafka:
        condition: service_healthy
    ports: ["18088:18088"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
