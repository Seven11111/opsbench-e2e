    public_task:
      symptom: 'Prometheus is experiencing performance degradation: target refresh
        operations are failing, as indicated by an increasing `prometheus_sd_http_failures_total`
        counter. Additionally, some metrics are missing from scraped targets, and
        the overall system is slow.'
      impact: Monitoring gaps and delayed alerting due to incomplete or failed target
        refreshes.
      objective: Restore normal target refresh behavior so that all configured targets
        are scraped successfully and the `prometheus_sd_http_failures_total` counter
        stops increasing.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
    allowed_tools:
    - shell
    - health_check
    - metrics_query
    expected_actions:
    - primitive_id: prometheus_scrape_target_v1
      action: repair
    success_checks:
    - check_id: scrape_up
      weight: 0.5
    - check_id: service_health
      weight: 0.5
    negative_controls:
    - scenario: no_op
      expected: fail
      reason: The symptom is persistent; no action leaves the failing state unchanged.
    - scenario: wrong_fix
      expected: fail
      reason: Modifying an unrelated configuration parameter (e.g., changing scrape
        interval) does not address the excessive file watch issue.
    - scenario: partial_fix
      expected: fail
      reason: Reducing the number of watched files partially but not completely (e.g.,
        only removing one of many unnecessary files) leaves the root cause unresolved.
