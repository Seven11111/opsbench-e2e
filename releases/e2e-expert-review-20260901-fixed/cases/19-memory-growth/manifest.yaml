    public_task:
      symptom: The worker health signal has become unreliable while the service is still
        reachable. Repeated live observations show the worker's memory usage growing
        and approaching its declared resource budget; the same workload should remain
        available while the resource signal is stabilized.
      impact: The worker may exhaust its memory headroom and the documented workflow
        cannot complete reliably. Preserve the service's HTTP and workload contract
        while resolving the resource pressure.
      objective: Diagnose the live memory signal, stop the abnormal growth at its source,
        and verify both business recovery and stable memory headroom after the observation
        boundary.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
      - Do not claim recovery from a single health response; inspect repeated resource
        observations.
    allowed_tools:
    - shell
