services:
  target:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPSBENCH_BASE_IMAGE: ${OPSBENCH_HARD_BASE_IMAGE:-python:3.12-slim}
    image: opsbench-e2e-http_dependency_timeout_slo_v1
    hostname: target
    working_dir: /agent-runtime
    cpus: "1.0"
    mem_limit: 384m
    pids_limit: 128
    tmpfs:
      - /data:size=24m,nr_inodes=256,mode=0777
      - /var/cache/demo:size=8m,mode=0777
    ulimits:
      nofile: 256
    volumes:
      - ${OPSBENCH_PUBLIC_DIR:-../public}:/opsbench/public:ro
      - ${OPSBENCH_TRACE_DIR:-../trace}:/opsbench/trace
    environment:
      OPSBENCH_BASE_URL: ${OPSBENCH_BASE_URL:-https://api.deepseek.com}
      OPSBENCH_AGENT_MODEL: ${OPSBENCH_AGENT_MODEL:-deepseek-v4-flash}
      OPSBENCH_REQUEST_TIMEOUT: ${OPSBENCH_REQUEST_TIMEOUT:-300}
      OPSBENCH_MAX_RETRIES: ${OPSBENCH_MAX_RETRIES:-2}
      OPSBENCH_HEALTH_MODE: service
      OPSBENCH_TEMPLATE_ID: http_dependency_timeout_slo_v1
      OPSBENCH_DIAGNOSTIC_MODE: http_dependency_timeout_slo_v1
      OPSBENCH_SERVICE_REPAIR_MODE: http_dependency_timeout_slo_v1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
