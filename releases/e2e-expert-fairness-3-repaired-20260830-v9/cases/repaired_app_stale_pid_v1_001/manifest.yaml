    public_task:
      symptom: The HTTP service is reported as active by the system service manager,
        but health checks against the service fail. The service does not respond to
        requests, and the service manager indicates the service started successfully
        even though the service binary is not functioning.
      impact: Users cannot access the HTTP service, causing downtime.
      objective: Restore the service to a state where it passes health checks and
        responds to requests correctly. The service manager should accurately reflect
        the service's operational status.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
