services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  target:
    build: {context: ., dockerfile: Dockerfile}
    command: ["python", "/opt/opsbench/service.py"]
    working_dir: /runtime
    user: "10001:10001"
    volumes:
      - ./runtime:/runtime
      - ${OPSBENCH_PUBLIC_DIR:-../public}:/opsbench/public:ro
      - ${OPSBENCH_TRACE_DIR:-../trace}:/opsbench/trace
    environment:
      OPSBENCH_TEMPLATE_ID: fidelity_kafka_offset_commit_failure_v1
      OPSBENCH_NATIVE_FEATURES: "systemd --user systemd-analyze StartLimitBurst"
      XDG_RUNTIME_DIR: /run/user/10001
      DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/opsbench-bus
    ulimits:
      nofile: 128
    pids_limit: 128
    ports: ["8080:8080", "8443:8443"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      kafka:
        condition: service_healthy
  verifier:
    build: {context: ., dockerfile: Dockerfile}
    command: ["sleep", "infinity"]
    user: "10001:10001"
    volumes:
      - ../:/opsbench/case:ro
      - ./runtime:/runtime:ro
    environment:
      OPSBENCH_TARGET_URL: http://target:8080
      XDG_RUNTIME_DIR: /run/user/10001
      DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/opsbench-bus
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
