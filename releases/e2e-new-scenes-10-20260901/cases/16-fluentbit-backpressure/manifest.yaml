    public_task:
      symptom: Fluent Bit HTTP input plugins pause their shared HTTP listener, causing
        incoming connections to be accepted and immediately closed. Clients see a
        connection close before a response arrives, and any in-flight requests are
        dropped. Data from HTTP sources is lost.
      impact: Data ingestion from HTTP-based sources (e.g., http, splunk, elasticsearch,
        opentelemetry, prometheus_remote_write) stops; no new data is received and
        buffered.
      objective: Restore normal data ingestion so that all HTTP sources are successfully
        received and processed without data loss.
      constraints:
      - Use only the provided runtime tools.
      - Do not replace the service with a new implementation.
