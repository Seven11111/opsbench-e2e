services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  target:
    build: {context: ., dockerfile: Dockerfile}
    command: ["python", "/opt/opsbench/runtime/service.py"]
    volumes:
      - ./runtime/state.json:/runtime/state.json
      - ./runtime/refresh-base.json:/runtime/refresh-base.json:ro
      - ./runtime/catalog-base.json:/runtime/catalog-base.json:ro
      - ./runtime/refresh.env:/runtime/refresh.env
      - ./runtime/last-refresh.json:/runtime/last-refresh.json
      - ./runtime/catalog.log:/runtime/catalog.log
      - ./runtime/refresh-worker.log:/runtime/refresh-worker.log
      - ./runtime/audit.jsonl:/runtime/audit.jsonl
      - ./runtime/refresh.trigger:/runtime/refresh.trigger
      - ${OPSBENCH_PUBLIC_DIR:-../public}:/opsbench/public:ro
      - ${OPSBENCH_TRACE_DIR:-../trace}:/opsbench/trace
    environment:
      OPSBENCH_HEALTH_MODE: service
      OPSBENCH_HEALTH_URL: http://127.0.0.1:18087/health
      OPSBENCH_CASE_MODE: redis-refresh-drift-v2
    depends_on: [redis]
    ports: ["18087:18087"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
